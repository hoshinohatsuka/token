<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token</title>
<meta name="author" content="ForJiang">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #07090a; color: #e7ece9;
    font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    font-size: 14px; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 20px;
  }
  .form-label { display: block; margin-bottom: 6px; }
  #tokviz textarea.form-control, #tokviz select.form-select {
    font: inherit; color: #e7ece9; background: rgba(36, 36, 38, 0.82);
    border: 1px solid #363638; border-radius: 8px; padding: 7px 10px;
  }
  #tokviz select.form-select { height: 32px; padding: 0 10px; }
  #tokviz textarea.form-control { width: 100%; resize: vertical; }
  #tokviz textarea.form-control:focus, #tokviz select.form-select:focus { outline: 1px solid #525256; }
  #tokviz .btn {
    font: inherit; color: #dfe7e2; background: rgba(36, 36, 38, 0.82);
    border: 1px solid #363638; border-radius: 8px;
    height: 32px; padding: 0 12px; cursor: pointer;
    display: inline-flex; align-items: center;
  }
  #tokviz .btn:hover { border-color: #4e4e52; }
  #tokviz .btn-sm { padding: 0 10px; }
  .viz-controls, .viz-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .viz-badge { border-radius: 99px; padding: 2px 10px; background: rgba(36, 36, 38, 0.82); color: #a0a0a5; font-size: 12px; border: 1px solid #363638; }
  .text-muted { color: #a0a0a5; }
  .text-small { font-size: 12px; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  .tk-foot { margin: 0 auto 18px; color: #6e6e73; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<script>
/* 全页背景模式：字符波浪铺满整个视口 */
window.__TOKEN_FULLPAGE__ = true;
/* 独立运行时的 widget 状态兜底：localStorage 持久化 */
window.zcode = {
  widgetState: null,
  setWidgetState: function (s) {
    this.widgetState = Object.assign({}, this.widgetState, s);
    try { localStorage.setItem('token-widget-state', JSON.stringify(this.widgetState)); } catch (e) {}
    return Promise.resolve();
  }
};
try { window.zcode.widgetState = JSON.parse(localStorage.getItem('token-widget-state') || 'null'); } catch (e) {}
</script>

<div id="tokviz">
  <style>
    #tokviz {
      position: relative; overflow: hidden;
      background: #07090a; color: #e7ece9;
      border-radius: 14px; padding: 16px;
    }
    #tokviz .tk-glyph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #tokviz .tk-content { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px; }
    #tokviz .tk-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    #tokviz .tk-brand { display: flex; align-items: center; gap: 8px; }
    #tokviz .tk-enc { display: flex; align-items: center; gap: 8px; }
    #tokviz .tk-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
    #tokviz .tk-lang {
      display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    #tokviz .tk-lang button {
      border: none; background: transparent; color: #a0a0a5; font: inherit;
      font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
      cursor: pointer; white-space: nowrap; transition: color .15s, background-color .15s;
    }
    #tokviz .tk-lang button:hover { color: #e7ece9; background: rgba(255, 255, 255, 0.08); }
    #tokviz .tk-lang button.tk-on { background: #e7ece9; color: #0a0c0b; cursor: default; }
    #tokviz .tk-enc .form-label { margin: 0; color: #a0a0a5; }
    #tokviz .tk-enc .form-select { height: 32px; padding: 0 10px; }
    #tokviz .tk-presets .btn { height: 32px; padding: 0 12px; display: inline-flex; align-items: center; }
    #tokviz .tk-head h3 { margin: 0; color: #f2f7f4; }
    #tokviz .form-label { color: #e7ece9; }
    #tokviz .text-muted { color: #a0a0a5; }
    #tokviz .tok-chips { display: flex; flex-wrap: wrap; gap: 2px; align-items: flex-start; min-height: 30px; }
    #tokviz .tok-chip {
      position: relative;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      padding: 1px 5px; border-radius: 6px; white-space: pre; word-break: break-all;
      border: 1px solid transparent;
    }
    #tokviz .tok-chip:hover { border-color: rgba(255, 255, 255, 0.38); }
    #tokviz .tok-chip.tk-focus { border-color: #d97757; box-shadow: 0 0 0 1px rgba(217, 119, 87, 0.55); }
    #tokviz .tok-chip.tk-peer { border-color: rgba(240, 240, 242, 0.52); }
    #tokviz .tok-chip.tk-dim { opacity: 0.44; }
    #tokviz .tk-word  { background: rgba(96, 150, 224, 0.26); --blk: rgba(96, 150, 224, 0.62); }
    #tokviz .tk-cjk   { background: rgba(177, 122, 216, 0.30); --blk: rgba(177, 122, 216, 0.66); }
    #tokviz .tk-num   { background: rgba(160, 160, 168, 0.28); --blk: rgba(160, 160, 168, 0.65); }
    #tokviz .tk-punct { background: rgba(224, 150, 70, 0.24); --blk: rgba(224, 150, 70, 0.58); }
    #tokviz .tk-ws    { background: rgba(255, 255, 255, 0.08); color: #a0a0a5; --blk: rgba(255, 255, 255, 0.18); }
    #tokviz .tk-byte  { background: rgba(224, 102, 96, 0.30); color: #f6dedb; --blk: rgba(224, 102, 96, 0.62); }
    #tokviz .tk-block {
      position: absolute; inset: 0; z-index: 2; border-radius: inherit;
      pointer-events: none; background: var(--blk, rgba(255, 255, 255, 0.22));
    }
    #tokviz .tok-chip.tk-anim .tk-block {
      animation: tk-sweep 0.16s cubic-bezier(0.87, 0, 0.13, 1) var(--d, 0ms) both;
    }
    #tokviz .tok-chip.tk-anim .tk-txt {
      opacity: 0;
      animation: tk-show 1ms linear calc(var(--d, 0ms) + 0.07s) forwards;
    }
    @keyframes tk-sweep {
      0%    { transform: scaleX(0); transform-origin: left center; }
      49.9% { transform: scaleX(1); transform-origin: left center; }
      50%   { transform: scaleX(1); transform-origin: right center; }
      100%  { transform: scaleX(0); transform-origin: right center; }
    }
    @keyframes tk-show { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #tokviz .tok-chip .tk-block { display: none; }
      #tokviz .tok-chip .tk-txt { opacity: 1 !important; animation: none !important; }
    }
    #tokviz .tok-stat b { font-weight: 500; color: #f2f7f4; }
    #tokviz .st-unit { color: #a0a0a5; font-style: normal; margin-left: 4px; }
    #tokviz .tk-legend > span { color: #a0a0a5; }
    #tokviz .tok-empty { color: #a0a0a5; }
    #tokviz .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
    #tokviz [hidden] { display: none !important; }
    #tokviz .tk-rel-toggle {
      margin-left: auto; border: 1px solid #363638; background: rgba(36, 36, 38, 0.82);
      color: #dfe7e2; font: inherit; font-size: 12px; font-weight: 600;
      padding: 4px 12px; border-radius: 999px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; transition: border-color .15s, background-color .15s, color .15s;
    }
    #tokviz .tk-rel-toggle:hover { border-color: #4e4e52; background: rgba(48, 48, 52, 0.9); }
    #tokviz .tk-rel-toggle.tk-on { background: rgba(217, 119, 87, 0.20); border-color: rgba(217, 119, 87, 0.68); color: #f6ded5; }
    #tokviz .tk-rel-panel {
      background: rgba(26, 26, 28, 0.92); border: 1px solid #363638; border-radius: 12px;
      padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
    }
    #tokviz .tk-rel-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    #tokviz .tk-rel-tabs, #tokviz .tk-rel-sub {
      display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 3px;
      border-radius: 999px; background: rgba(255, 255, 255, 0.06);
    }
    #tokviz .tk-rel-tabs button, #tokviz .tk-rel-sub button {
      border: none; background: transparent; color: #a0a0a5; font: inherit; font-size: 12px; font-weight: 600;
      padding: 3px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    }
    #tokviz .tk-rel-tabs button.tk-on, #tokviz .tk-rel-sub button.tk-on { background: #e7ece9; color: #0a0c0b; cursor: default; }
    #tokviz .tk-rel-note { font-size: 11px; color: #c79a86; background: rgba(217, 119, 87, 0.12); border: 1px solid rgba(217, 119, 87, 0.30); border-radius: 999px; padding: 2px 9px; }
    #tokviz .tk-rel-scroll { overflow-x: auto; padding-bottom: 4px; }
    #tokviz .tk-rel-svg { display: block; min-width: 100%; height: auto; }
    #tokviz .tk-rel-grid {
      display: grid; gap: 2px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; align-items: center;
      background: rgba(18, 18, 20, 0.72); padding: 8px; border-radius: 8px; border: 1px solid #363638;
    }
    #tokviz .tk-rel-hdr {
      color: #a0a0a5; background: rgba(36, 36, 38, 0.75); border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 2px 4px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 48px;
      cursor: pointer; border-radius: 4px;
    }
    #tokviz .tk-rel-hdr:hover { color: #f2f7f4; border-color: #525256; }
    #tokviz .tk-rel-hdr.tk-on { color: #f2f7f4; background: rgba(217, 119, 87, 0.28); border-color: rgba(217, 119, 87, 0.65); }
    #tokviz .tk-rel-cell {
      height: 22px; min-width: 22px; border-radius: 3px; border: 1px solid #363638;
      display: flex; align-items: center; justify-content: center; font-size: 10px; color: rgba(242, 247, 244, 0.86);
      cursor: pointer; user-select: none;
      background: rgba(36, 36, 38, 0.65);
    }
    #tokviz .tk-rel-cell.tk-mask { background: rgba(20, 20, 22, 0.5); border-color: rgba(255, 255, 255, 0.02); cursor: default; color: transparent; }
    #tokviz .tk-rel-cell.tk-hi { outline: 1px solid rgba(217, 119, 87, 0.9); }
    #tokviz .tk-rel-split { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; }
    @media (max-width: 720px) { #tokviz .tk-rel-split { grid-template-columns: 1fr; } }
    #tokviz .tk-rel-list { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
    #tokviz .tk-rel-edge {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 8px;
      border-radius: 7px; background: rgba(36, 36, 38, 0.65); border: 1px solid #363638; cursor: pointer;
      font-family: ui-monospace, Menlo, monospace; color: #dfe7e2;
    }
    #tokviz .tk-rel-edge:hover { border-color: rgba(217, 119, 87, 0.65); background: rgba(48, 48, 52, 0.85); }
    #tokviz .tk-rel-info { font-size: 12px; color: #a0a0a5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; border-top: 1px solid #363638; padding-top: 8px; }
  </style>

  <script>
    (function () {
      var host = document.getElementById('tokviz');
      if (host.dataset.glyphInit) return;
      host.dataset.glyphInit = '1';

      /* ================= 背景：字符波浪（Glyph Swell 风格） ================= */
      /* 独立站点设置 window.__TOKEN_FULLPAGE__ = true：画布铺满整个视口，指针全页生效 */
      var FULLPAGE = window.__TOKEN_FULLPAGE__ === true;
      var GLYPH_BG = '#07090a', GLYPH_INK = '#d97757';
      var RAMP = '·:-+=*#', CELL = 15;
      var canvas = document.createElement('canvas');
      canvas.className = 'tk-glyph';
      canvas.setAttribute('aria-hidden', 'true');
      canvas.style.cssText = FULLPAGE
        ? 'position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;'
        : 'position:absolute;inset:0;width:100%;height:100%;display:block;';
      (FULLPAGE ? document.body : host).insertBefore(canvas, host);
      var ctx = canvas.getContext('2d');

      var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var coarse = !matchMedia('(hover: hover) and (pointer: fine)').matches;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var size = coarse ? Math.round(CELL * 0.85) : CELL;
      var L = RAMP.length;

      /* 字形图集：墨水色一排、浪峰色一排 */
      var atlas = document.createElement('canvas');
      var S = Math.ceil(size * dpr);
      atlas.width = S * L; atlas.height = S;
      var a = atlas.getContext('2d');
      function paintAtlas() {
        a.clearRect(0, 0, atlas.width, atlas.height);
        a.textAlign = 'center'; a.textBaseline = 'middle';
        a.font = '500 ' + Math.round(size * 0.82 * dpr) + 'px ui-monospace, Menlo, monospace';
        a.fillStyle = GLYPH_INK;
        for (var i = 0; i < L; i++) a.fillText(RAMP[i], i * S + S / 2, S / 2 + dpr * 0.5);
      }
      paintAtlas();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { paintAtlas(); });

      var W = 0, H = 0, cols = 0, rows = 0;
      var raf = 0, visible = false, last = 0, alive = true, greeted = false;
      var swells = [];
      var t0 = performance.now();
      function now() { return (performance.now() - t0) / 1000; }

      function resize() {
        var w = FULLPAGE ? window.innerWidth : host.clientWidth;
        var h = FULLPAGE ? window.innerHeight : host.clientHeight;
        if (w === W && h === H) return;
        W = w; H = h;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        cols = Math.ceil(W / size) + 1;
        rows = Math.ceil(H / size) + 1;
      }

      function draw(tDraw) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!swells.length) return;
        var minI = cols, maxI = -1, minJ = rows, maxJ = -1;
        for (var k0 = 0; k0 < swells.length; k0++) {
          var s0 = swells[k0];
          var rMax = (tDraw - s0.t) * 17 + 7;
          if (rMax < 0) continue;
          minI = Math.min(minI, Math.floor(s0.x - rMax));
          maxI = Math.max(maxI, Math.ceil(s0.x + rMax));
          minJ = Math.min(minJ, Math.floor(s0.y - rMax));
          maxJ = Math.max(maxJ, Math.ceil(s0.y + rMax));
        }
        minI = Math.max(0, minI); maxI = Math.min(cols - 1, maxI);
        minJ = Math.max(0, minJ); maxJ = Math.min(rows - 1, maxJ);
        if (minI > maxI || minJ > maxJ) return;
        var ox = ((W - (cols - 1) * size) / 2) * dpr;
        var oy = ((H - (rows - 1) * size) / 2) * dpr;
        for (var j = minJ; j <= maxJ; j++) {
          for (var i = minI; i <= maxI; i++) {
            var v = 0;

      }

      function approxTokens(text) {
        var runs = [];
        for (var it = text[Symbol.iterator](), r = it.next(); !r.done; r = it.next()) {
          var ch = r.value, c = classifyCp(ch);
          if (runs.length && runs[runs.length - 1].cls === c) runs[runs.length - 1].text += ch;
          else runs.push({ cls: c, text: ch });
        }
        var toks = [];
        runs.forEach(function (run) {
          var i, s2;
          if (run.cls === 'ws') {
            if (run.text) toks.push({ text: run.text, type: 'ws' });
          } else if (run.cls === 'cjk') {
            for (it = run.text[Symbol.iterator](), r = it.next(); !r.done; r = it.next())
              toks.push({ text: r.value, type: 'cjk' });
          } else if (run.cls === 'digit') {
            s2 = run.text;
            while (s2.length) { var n = Math.min(3, s2.length); toks.push({ text: s2.slice(0, n), type: 'num' }); s2 = s2.slice(n); }
          } else if (run.cls === 'letter') {
            toks = toks.concat(splitWordText({ text: run.text, type: 'word' }));
          } else if (run.cls === 'emoji') {
            var ms = run.text.match(/\p{Extended_Pictographic}(?:\u200D\p{Extended_Pictographic}|\uFE0F)*/gu) || [run.text];
            for (i = 0; i < ms.length; i++) toks.push({ text: ms[i], type: 'punct' });
          } else {
            for (it = run.text[Symbol.iterator](), r = it.next(); !r.done; r = it.next())

      }

      /* ---------- 真实切分 ---------- */
      var MAX_CHIPS = 2000;
      function classifyReal(s) {
        if (/^\s+$/.test(s)) return 'ws';
        if (/[\u3400-\u9FFF\uF900-\uFAFF\u3040-\u30FF\uAC00-\uD7AF]/.test(s)) return 'cjk';
        if (/^\s*[0-9\uFF10-\uFF19]+$/.test(s)) return 'num';
        if (/^\s*[\p{L}\p{M}][\p{L}\p{M}'’\- ]*$/u.test(s)) return 'word';
        return 'punct';
      }

      var UTF8E = new TextEncoder();
      function byteLen(s) { return UTF8E.encode(s).length; }
      function hex2(b) { return (b < 16 ? '0' : '') + b.toString(16).toUpperCase(); }

      /* 本地基线：字符级 / UTF-8 字节级 */
      function localTokens(text, enc) {
        var chips = [];
        if (enc === 'char') {
          var i = 0;
          for (var it = text[Symbol.iterator](), r = it.next(); !r.done && i < MAX_CHIPS; r = it.next()) {
            var ch = r.value, cp = ch.codePointAt(0);
            chips.push({
              text: ch, type: classifyReal(ch), id: cp, idx: i,
              tip: '#' + (i + 1) + ' · ' + t('tip_codepoint') + ' U+' + cp.toString(16).toUpperCase() + ' · ' + byteLen(ch) + ' ' + t('tip_byte_word')
            });
            i++;
          }
          return { count: Array.from(text).length, chips: chips };
        }
        var bytes = UTF8E.encode(text);
        for (var j = 0; j < bytes.length && j < MAX_CHIPS; j++) {
          var hex = hex2(bytes[j]);
          chips.push({
            text: '\u2039' + hex + '\u203A', type: 'byte', id: bytes[j], idx: j,
            tip: '#' + (j + 1) + ' · ' + t('tip_byte_word') + ' ' + hex
          });
        }
        return { count: bytes.length, chips: chips };
      }

      function tokenize(text) {
        var enc = sel.value;
        if (enc === 'char' || enc === 'utf8') return localTokens(text, enc);
        if (mod && modEnc === enc) {
          try {
            var ids = mod.encode(text);
            var shown = ids.length > MAX_CHIPS ? MAX_CHIPS : ids.length;
            var chips = [];
            var api = mod.default || mod;
            var proc = api && api.bytePairEncodingCoreProcessor;
            var usedGen = false;
            if (proc && typeof proc.decodeNativeGenerator === 'function') {
              /* 每个 token 产出字符串或原始字节；跨 token 的字节用流式解码拼回 */
              try {
                var dec = new TextDecoder('utf8');

                var i = 0;
                for (var step = gen.next(); !step.done && i < shown; step = gen.next()) {

                    try { s = dec.decode(piece, { stream: true }); } catch (e) { s = ''; }
                    var hex = [];
                    for (var k = 0; k < piece.length; k++) hex.push(hex2(piece[k]));
                    bytesHex = hex.join(' ');
                  }
                  var partial = !s;
                  chips.push({
                    text: partial ? '\u2039' + ids[i] + '\u203A' : s,
                    type: partial ? 'byte' : classifyReal(s),
                    id: ids[i], idx: i, bytesHex: bytesHex,
                    tip: bytesHex
                      ? '#' + (i + 1) + ' · ID ' + ids[i] + ' · ' + t('tip_byte_word') + ' ' + bytesHex
                      : '#' + (i + 1) + ' · ID ' + ids[i] + ' · ' + byteLen(s) + ' ' + t('tip_byte_word')
                  });
                  i++;
                }
                usedGen = true;
              } catch (e) { chips = []; usedGen = false; }
            }
            if (!usedGen) {
              for (var j = 0; j < shown; j++) {
                var s2;
                try { s2 = mod.decode([ids[j]]); } catch (e) { s2 = '\uFFFD'; }
                var partial2 = !s2 || s2.indexOf('\uFFFD') !== -1;
                chips.push({
                  text: partial2 ? '\u2039' + ids[j] + '\u203A' : s2,
                  type: partial2 ? 'byte' : classifyReal(s2),
                  id: ids[j], idx: j, bytesHex: null,
                  tip: '#' + (j + 1) + ' · ID ' + ids[j] + ' · ' + (s2 ? byteLen(s2) : 0) + ' ' + t('tip_byte_word')
                });
              }
            }
            return { count: ids.length, chips: chips };
          } catch (e) { /* fall through to approx */ }
        }
        var all = approxTokens(text);
        all.forEach(function (tk, i) { tk.idx = i; tk.tip = '#' + (i + 1) + ' · ' + t('tip_approx'); });
        return { count: all.length, chips: all.slice(0, MAX_CHIPS) };
      }

      /* ---------- 渲染 ---------- */
      function displayText(s) {
        var d = s.replace(/\r/g, '').replace(/ /g, '\u2423').replace(/\n/g, '\u00B6').replace(/\t/g, '\u21E5');
        return d || '\u00B7';
      }

      var MAX_ANIM_CHIPS = 250;
      var MAX_REL_TOKENS = 48;
      var relBtn = $('tk-rel-btn'), relPanel = $('tk-rel-panel'), relBody = $('tk-rel-body'), relInfo = $('tk-rel-info');
      var relArcOpts = $('tk-rel-arc-opts'), relHeadOpts = $('tk-rel-head-opts');
      var relOpen = false, relTab = 'arc', relArcMode = 'attn', relHead = 'balanced';
      var lastChips = [], hoverIdx = -1, lockedIdx = -1;
      var prevSigs = null, renderT;

      function tokKey(c) {
        return c.id != null ? ('id:' + c.id) : ('tx:' + c.text);
      }

      function computeTransitions(chips) {
        var edgeMap = {}, freqMap = {}, nodes = [];
        for (var i = 0; i < chips.length; i++) {
          var k = tokKey(chips[i]);
          if (!freqMap[k]) {
            freqMap[k] = { key: k, label: displayText(chips[i].text), type: chips[i].type, id: chips[i].id, count: 0, indices: [] };
            nodes.push(freqMap[k]);
          }
          freqMap[k].count++;
          freqMap[k].indices.push(i);
          if (i < chips.length - 1) {
            var k2 = tokKey(chips[i + 1]);
            var ek = k + '\u0002' + k2;
            if (!edgeMap[ek]) {
              edgeMap[ek] = {
                fromKey: k, toKey: k2,
                fromLabel: displayText(chips[i].text), toLabel: displayText(chips[i + 1].text),
                count: 0, positions: []
              };
            }
            edgeMap[ek].count++;
            edgeMap[ek].positions.push([i, i + 1]);
          }
        }
        var edges = Object.keys(edgeMap).map(function (ek) { return edgeMap[ek]; });
        edges.sort(function (a, b) { return b.count - a.count; });
        var repeats = nodes.filter(function (n) { return n.count >= 2; }).sort(function (a, b) { return b.count - a.count; });
        var topNodes = nodes.slice().sort(function (a, b) { return b.count - a.count; }).slice(0, 16);
        var nodeIdx = {};
        topNodes.forEach(function (n, idx) { nodeIdx[n.key] = idx; });
        var matrix = topNodes.map(function () { return topNodes.map(function () { return 0; }); });
        var maxCell = 0;
        edges.forEach(function (e) {
          var r = nodeIdx[e.fromKey], c = nodeIdx[e.toKey];
          if (r != null && c != null) {
            matrix[r][c] = e.count;
            if (e.count > maxCell) maxCell = e.count;
          }
        });
        return {
          totalTransitions: Math.max(0, chips.length - 1),
          edges: edges,
          topEdges: edges.slice(0, 12),
          repeats: repeats.slice(0, 10),
          topNodes: topNodes,
          matrix: matrix,
          maxCell: maxCell

      }

      var OPEN_PAIRS = { '(': ')', '[': ']', '{': '}', '（': '）', '【': '】', '「': '」' };
      var CLOSE_PAIRS = { ')': '(', ']': '[', '}': '{', '）': '（', '】': '【', '」': '「' };

      function computeApproxAttention(chips, head) {
        var n = Math.min(chips.length, MAX_REL_TOKENS);
        var h = head || 'balanced';
        var tau = h === 'local' ? 2.6 : (h === 'struct' ? 14 : 7);
        var matchOf = {};
        var stack = {};
        for (var m = 0; m < n; m++) {
          var trimmed = chips[m].text.replace(/\s+/g, '');
          if (OPEN_PAIRS[trimmed]) {
            if (!stack[trimmed]) stack[trimmed] = [];
            stack[trimmed].push(m);
          } else if (CLOSE_PAIRS[trimmed]) {
            var opener = CLOSE_PAIRS[trimmed];
            if (stack[opener] && stack[opener].length) {
              matchOf[m] = stack[opener].pop();
            }
          } else if (trimmed === '"' || trimmed === "'") {
            if (!stack[trimmed]) stack[trimmed] = [];
            if (stack[trimmed].length) matchOf[m] = stack[trimmed].pop();
            else stack[trimmed].push(m);
          }
        }
        var weights = [];
        for (var q = 0; q < n; q++) {

          var maxS = -Infinity;
          var qKey = tokKey(chips[q]);
          for (var k = 0; k < n; k++) {
            if (k > q) { row[k] = 0; continue; }
            var dist = q - k;
            var s = -dist / tau;
            if (k === q) {
              s += h === 'local' ? 0.75 : (h === 'struct' ? 0.35 : 0.55);
            } else {
              if (k === 0) s += h === 'local' ? 0.3 : (h === 'struct' ? 0.6 : 0.85);
              if (dist === 1) s += h === 'local' ? 1.5 : (h === 'struct' ? 0.65 : 1.1);
              if (tokKey(chips[k]) === qKey) s += h === 'local' ? 0.6 : (h === 'struct' ? 2.35 : 1.65);
              if (matchOf[q] === k) s += h === 'local' ? 0.7 : (h === 'struct' ? 2.7 : 2.2);
              if (chips[q].type === chips[k].type && chips[k].type !== 'ws') {
                s += h === 'local' ? 0.2 : (h === 'struct' ? 0.7 : 0.4);
              }
              if (chips[k].type === 'ws' && dist > 1) s -= 0.65;
            }
            scores[k] = s;
            if (s > maxS) maxS = s;
          }
          var sumExp = 0;
          for (var k2 = 0; k2 <= q; k2++) {

          for (var k3 = 0; k3 <= q; k3++) row[k3] /= sumExp;

      }

      var TYPE_COLORS = {
        word: '#6096e0', cjk: '#b17ad8', num: '#9ea0a8',
        punct: '#e09646', ws: '#8e8e93', byte: '#e06660'
      };

      function activeFocus(n) {
        var idx = lockedIdx >= 0 && lockedIdx < n ? lockedIdx : (hoverIdx >= 0 && hoverIdx < n ? hoverIdx : n - 1);
        return n > 0 ? idx : -1;
      }

      function syncChipHighlights() {
        var chipEls = chipsEl ? chipsEl.children : [];
        var n = Math.min(lastChips.length, MAX_REL_TOKENS);
        var focus = (relOpen && lastChips.length >= 2) ? activeFocus(n) : -1;
        if (!relOpen || (hoverIdx < 0 && lockedIdx < 0)) {
          for (var c0 = 0; c0 < chipEls.length; c0++) {
            if (chipEls[c0].classList) {
              chipEls[c0].classList.toggle('tk-focus', false);
              chipEls[c0].classList.toggle('tk-peer', false);
              chipEls[c0].classList.toggle('tk-dim', false);
            }
          }
          return;
        }
        var peers = {};
        if (focus >= 0) {
          if (relTab === 'attn' || (relTab === 'arc' && relArcMode === 'attn')) {
            var attn = computeApproxAttention(lastChips, relHead);
            var row = attn.weights[focus] || [];
            for (var k = 0; k <= focus; k++) {
              if (k !== focus && row[k] >= 0.08) peers[k] = true;
            }
          } else {
            if (focus > 0) peers[focus - 1] = true;
            if (focus < lastChips.length - 1) peers[focus + 1] = true;
            var fk = tokKey(lastChips[focus]);
            for (var j = 0; j < lastChips.length; j++) {
              if (j !== focus && tokKey(lastChips[j]) === fk) peers[j] = true;
            }
          }
        }
        for (var i = 0; i < chipEls.length; i++) {
          var el = chipEls[i];
          if (!el || !el.classList || !el.hasAttribute || !el.hasAttribute('data-idx')) continue;
          var idx = Number(el.getAttribute('data-idx'));
          var isFocus = idx === focus;
          var isPeer = !!peers[idx];
          el.classList.toggle('tk-focus', isFocus);
          el.classList.toggle('tk-peer', !isFocus && isPeer);
          el.classList.toggle('tk-dim', focus >= 0 && !isFocus && !isPeer);
        }
      }

      function updateRelControls() {

      }

      function renderRelations() {
        updateRelControls();

        var attn = computeApproxAttention(lastChips, relHead);
        var n = attn.n;
        var focus = activeFocus(n);
        var SVG_NS = 'http://www.w3.org/2000/svg';

                repArc.setAttribute('stroke-width', (prevI === focus || rIdx === focus) ? '2' : '1.4');
                repArc.setAttribute('data-tooltip', displayText(lastChips[rIdx].text) + ' (#' + (prevI + 1) + ' \u2194 #' + (rIdx + 1) + ')');

            circ.setAttribute('cy', String(baseY + 4));
            circ.setAttribute('r', ni === focus ? '6' : '4.2');
            circ.setAttribute('fill', ni === focus ? '#d97757' : (TYPE_COLORS[ch.type] || '#9e9ea3'));
            circ.setAttribute('stroke', ni === focus ? '#f2f7f4' : 'none');
            circ.setAttribute('stroke-width', '1.4');
            var lbl = document.createElementNS(SVG_NS, 'text');
            lbl.setAttribute('x', String(cx));
            lbl.setAttribute('y', String(baseY + 24));
            lbl.setAttribute('text-anchor', 'middle');
            lbl.setAttribute('fill', ni === focus ? '#f2f7f4' : '#9e9ea3');
            lbl.setAttribute('font-size', '11');
            lbl.setAttribute('font-family', 'ui-monospace, Menlo, monospace');
            var txtStr = displayText(ch.text);
            lbl.textContent = txtStr.length > 4 ? txtStr.slice(0, 3) + '\u2026' : txtStr;
            g.appendChild(circ);
            g.appendChild(lbl);
            svg.appendChild(g);
          }
          wrap.appendChild(svg);
          relBody.appendChild(wrap);
        } else if (relTab === 'attn') {
          var mWrap = document.createElement('div');
          mWrap.className = 'tk-rel-scroll';
          var grid = document.createElement('div');
          grid.className = 'tk-rel-grid';
          grid.style.gridTemplateColumns = '48px repeat(' + n + ', minmax(22px, 1fr))';
          var corner = document.createElement('div');
          corner.className = 'tk-rel-hdr';
          corner.textContent = 'q\\k';
          grid.appendChild(corner);
          for (var hc = 0; hc < n; hc++) {
            var chdr = document.createElement('div');
            chdr.className = 'tk-rel-hdr' + (hc === focus ? ' tk-on' : '');
            chdr.textContent = displayText(lastChips[hc].text);
            chdr.setAttribute('data-rel-idx', String(hc));
            grid.appendChild(chdr);
          }
          for (var rq = 0; rq < n; rq++) {
            var rhdr = document.createElement('div');
            rhdr.className = 'tk-rel-hdr' + (rq === focus ? ' tk-on' : '');
            rhdr.textContent = (rq + 1) + ':' + displayText(lastChips[rq].text);
            rhdr.setAttribute('data-rel-idx', String(rq));
            grid.appendChild(rhdr);
            for (var ck = 0; ck < n; ck++) {
              var cell = document.createElement('div');
              if (ck > rq) {

              } else {
                var val = attn.weights[rq][ck];
                cell.className = 'tk-rel-cell' + (rq === focus ? ' tk-hi' : '');
                cell.style.background = 'rgba(217, 119, 87, ' + Math.min(0.95, 0.05 + val * 0.92).toFixed(3) + ')';
                cell.setAttribute('data-rel-idx', String(rq));
                cell.setAttribute('data-tooltip', '#' + (rq + 1) + ' ' + displayText(lastChips[rq].text) + ' \u2190 #' + (ck + 1) + ' ' + displayText(lastChips[ck].text) + ' \u00B7 ' + (val * 100).toFixed(1) + '%');
                if (n <= 14) cell.textContent = (val * 100).toFixed(0);
              }
              grid.appendChild(cell);
            }
          }
          mWrap.appendChild(grid);
          relBody.appendChild(mWrap);
        } else {
          var split = document.createElement('div');
          split.className = 'tk-rel-split';
          var mScroll = document.createElement('div');
          mScroll.className = 'tk-rel-scroll';
          var tn = trans.topNodes;
          var tGrid = document.createElement('div');
          tGrid.className = 'tk-rel-grid';
          tGrid.style.gridTemplateColumns = '48px repeat(' + tn.length + ', minmax(22px, 1fr))';
          var tCorner = document.createElement('div');
          tCorner.className = 'tk-rel-hdr';
          tCorner.textContent = '\u2192';
          tGrid.appendChild(tCorner);
          for (var tc = 0; tc < tn.length; tc++) {
            var th = document.createElement('div');
            th.className = 'tk-rel-hdr';
            th.textContent = tn[tc].label;
            th.setAttribute('data-rel-idx', String(tn[tc].indices[0]));
            tGrid.appendChild(th);
          }
          for (var tr = 0; tr < tn.length; tr++) {
            var trh = document.createElement('div');
            trh.className = 'tk-rel-hdr';
            trh.textContent = tn[tr].label;
            trh.setAttribute('data-rel-idx', String(tn[tr].indices[0]));
            tGrid.appendChild(trh);
            for (var tc2 = 0; tc2 < tn.length; tc2++) {
              var cnt = trans.matrix[tr][tc2];
              var tCell = document.createElement('div');
              tCell.className = 'tk-rel-cell';
              if (cnt > 0) {
                var ratio = trans.maxCell ? cnt / trans.maxCell : 0;
                tCell.style.background = 'rgba(96, 150, 224, ' + (0.18 + ratio * 0.72).toFixed(2) + ')';
                tCell.textContent = String(cnt);
                tCell.setAttribute('data-tooltip', tn[tr].label + ' \u2192 ' + tn[tc2].label + ' \u00D7' + cnt);
              }
              tCell.setAttribute('data-rel-idx', String(tn[tr].indices[0]));
              tGrid.appendChild(tCell);
            }
          }
          mScroll.appendChild(tGrid);
          split.appendChild(mScroll);

          var listBox = document.createElement('div');
          listBox.className = 'tk-rel-list';
          var eTitle = document.createElement('div');
          eTitle.className = 'text-muted';
          eTitle.textContent = t('rel_top_edges');
          listBox.appendChild(eTitle);
          trans.topEdges.slice(0, 6).forEach(function (edge) {
            var rowBtn = document.createElement('button');
            rowBtn.type = 'button';
            rowBtn.className = 'tk-rel-edge';
            rowBtn.setAttribute('data-rel-idx', String(edge.positions[0][0]));
            rowBtn.textContent = edge.fromLabel + ' \u2192 ' + edge.toLabel + '  (\u00D7' + edge.count + ')';
            listBox.appendChild(rowBtn);
          });
          var rTitle = document.createElement('div');
          rTitle.className = 'text-muted';
          rTitle.style.marginTop = '4px';
          rTitle.textContent = t('rel_repeats');
          listBox.appendChild(rTitle);
          if (!trans.repeats.length) {
            var noRep = document.createElement('div');
            noRep.className = 'tok-empty';
            noRep.textContent = t('rel_no_repeats');
            listBox.appendChild(noRep);
          } else {
            trans.repeats.slice(0, 5).forEach(function (rep) {
              var repBtn = document.createElement('button');
              repBtn.type = 'button';
              repBtn.className = 'tk-rel-edge';
              repBtn.setAttribute('data-rel-idx', String(rep.indices[0]));
              repBtn.textContent = rep.label + '  \u00D7' + rep.count;
              listBox.appendChild(repBtn);
            });
          }
          split.appendChild(listBox);
          relBody.appendChild(split);
        }

        if (attn.truncated && relTab !== 'adj') {
          var trunc = document.createElement('div');
          trunc.className = 'tok-empty';
          trunc.style.marginTop = '6px';
          trunc.textContent = t('rel_trunc')(MAX_REL_TOKENS, lastChips.length);
          relBody.appendChild(trunc);
        }

        var focusSummary = '';
        if (focus >= 0 && lastChips[focus]) {
          focusSummary = '#' + (focus + 1) + ' "' + displayText(lastChips[focus].text) + '"' +
            (lockedIdx === focus ? ' [' + t('rel_locked') + ']' : '');
        }
        relInfo.textContent = focusSummary ? (focusSummary + ' · ' + t('rel_hint_lock')) : t('rel_hint_lock');
        syncChipHighlights();
      }

      function render() {
        clearTimeout(renderT);
        var text = input.value;
        var cps = Array.from(text).length;
        var bytes = UTF8E.encode(text).length;
        var res = tokenize(text);
        lastChips = res.chips || [];
        if (lockedIdx >= lastChips.length) lockedIdx = -1;
        if (hoverIdx >= lastChips.length) hoverIdx = -1;

        stTokens.textContent = res.count;
        stChars.textContent = cps;
        stBytes.textContent = bytes;
        stRatio.textContent = res.count ? (cps / res.count).toFixed(2) : '–';

        chipsEl.textContent = '';
        if (!text) {
          prevSigs = null;
          lastChips = [];
          lockedIdx = -1;
          hoverIdx = -1;
          var note = document.createElement('span');
          note.className = 'tok-empty';
          note.textContent = t('empty');
          chipsEl.appendChild(note);
          renderRelations();
          return;
        }

        /* 前缀 diff：只给“新出现/变化”的 Token 加入场动画 */
        var sigs = res.chips.map(function (t) {
          return t.type + '\u0001' + t.text + '\u0001' + (t.id == null ? '' : t.id);
        });
        var p = 0;
        if (prevSigs) {
          while (p < sigs.length && p < prevSigs.length && sigs[p] === prevSigs[p]) p++;
        }
        var allSame = prevSigs && prevSigs.length === sigs.length && p === sigs.length;
        prevSigs = sigs;
        var animCount = Math.max(1, sigs.length - p);
        var animate = !reduced && !allSame && (sigs.length - p) <= MAX_ANIM_CHIPS;

        /* 顺序接龙：步长随 Token 数自适应，总级联时长恒定 ≤ 约 1.7s */
        var step = Math.max(20, Math.min(120, 1600 / animCount));

        var frag = document.createDocumentFragment();
        res.chips.forEach(function (t, i) {
          var el = document.createElement('span');
          el.className = 'tok-chip tk-' + t.type;
          el.setAttribute('role', 'listitem');
          el.setAttribute('data-idx', String(i));
          el.setAttribute('aria-label', 'Token ' + (t.idx + 1) + ': ' + t.text);
          el.setAttribute('data-tooltip', t.tip || ('#' + (t.idx + 1) + ' · Token'));
          var anim = animate && i >= p;
          if (anim) {
            el.className += ' tk-anim';
            el.style.setProperty('--d', Math.round((i - p) * step) + 'ms');
            var blk = document.createElement('span');
            blk.className = 'tk-block';
            el.appendChild(blk);
          }
          var txt = document.createElement('span');
          txt.className = 'tk-txt';
          txt.textContent = displayText(t.text);
          el.appendChild(txt);
          frag.appendChild(el);
        });
        chipsEl.appendChild(frag);
        if (res.count > MAX_CHIPS) {
          var more = document.createElement('span');
          more.className = 'tok-empty';
          more.textContent = t('overflow')(MAX_CHIPS, res.count);
          chipsEl.appendChild(more);
        }
        renderRelations();
      }

      /* ---------- 状态保存 / 恢复 ---------- */
      var saveT;
      function saveState() {
        clearTimeout(saveT);
        saveT = setTimeout(function () {
          try {
            window.zcode && window.zcode.setWidgetState &&
              window.zcode.setWidgetState({
                modelContent: {
                  text: input.value.slice(0, 4000), encoding: sel.value, lang: lang,
                  relOpen: relOpen, relTab: relTab, relArcMode: relArcMode, relHead: relHead
                }
              });
          } catch (e) {}
        }, 400);
      }

      function setEncoding(enc) {
        if (enc === 'char' || enc === 'utf8') {
          badgeKey = enc; updateBadge(); render();
          return;
        }
        badgeKey = 'loading'; updateBadge();
        ensureModule(enc).then(function (ok) {
          if (sel.value !== enc) return;
          badgeKey = ok ? enc : 'fail';
          updateBadge();
          render();
        });
      }

      input.addEventListener('input', function () {
        saveState();
        clearTimeout(renderT);
        if (input.value.length > 500) renderT = setTimeout(render, 60);
        else render();
      });
      sel.addEventListener('change', function () { saveState(); setEncoding(sel.value); });
      qsa('#tokviz .tk-lang button').forEach(function (lbtn) {
        lbtn.addEventListener('click', function () {
          if (lbtn.getAttribute('data-lang') === lang) return;
          applyLang(lbtn.getAttribute('data-lang'));
          render(); saveState();
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll('#tokviz [data-preset]'), function (btn) {
        btn.addEventListener('click', function () {
          input.value = PRESETS[btn.getAttribute('data-preset')] || '';
          render(); saveState();
        });
      });
      if (relBtn) {
        relBtn.addEventListener('click', function () {
          relOpen = !relOpen;
          renderRelations();
          saveState();
        });
      }
      qsa('#tokviz [data-rel-tab]').forEach(function (tb) {
        tb.addEventListener('click', function () {
          relTab = tb.getAttribute('data-rel-tab');
          renderRelations();
          saveState();
        });
      });
      qsa('#tokviz [data-arc-mode]').forEach(function (ab) {
        ab.addEventListener('click', function () {
          relArcMode = ab.getAttribute('data-arc-mode');
          renderRelations();
          saveState();
        });
      });
      qsa('#tokviz [data-rel-head]').forEach(function (hb) {
        hb.addEventListener('click', function () {
          relHead = hb.getAttribute('data-rel-head');
          renderRelations();
          saveState();
        });
      });
      function bindFocusDelegation(container, attrName) {
        if (!container) return;
        container.addEventListener('mouseover', function (e) {
          if (!relOpen) return;
          var tEl = e.target && e.target.closest && e.target.closest('[' + attrName + ']');
          if (!tEl) return;
          var idx = Number(tEl.getAttribute(attrName));
          if (idx === hoverIdx) return;
          hoverIdx = idx;
          if (lockedIdx < 0) renderRelations();
        });
        container.addEventListener('mouseout', function (e) {
          if (!relOpen) return;
          var relTarget = e.relatedTarget;
          if (relTarget && container.contains && container.contains(relTarget)) return;
          if (hoverIdx !== -1) {
            hoverIdx = -1;
            if (lockedIdx < 0) renderRelations();
          }
        });
        container.addEventListener('click', function (e) {
          if (!relOpen) return;
          var tEl = e.target && e.target.closest && e.target.closest('[' + attrName + ']');
          if (!tEl) return;
          var idx = Number(tEl.getAttribute(attrName));
          lockedIdx = (lockedIdx === idx) ? -1 : idx;
          renderRelations();
        });
      }
      bindFocusDelegation(chipsEl, 'data-idx');
      bindFocusDelegation(relBody, 'data-rel-idx');

      var saved = null;
      try { saved = window.zcode && window.zcode.widgetState && window.zcode.widgetState.modelContent; } catch (e) {}
      if (saved && typeof saved.text === 'string') input.value = saved.text;
      else input.value = DEFAULT;
      if (saved && ALL_ENC.indexOf(saved.encoding) !== -1) sel.value = saved.encoding;
      if (saved && ALL_LANGS.indexOf(saved.lang) !== -1) lang = saved.lang;
      if (saved && typeof saved.relOpen === 'boolean') relOpen = saved.relOpen;
      if (saved && ['arc', 'attn', 'adj'].indexOf(saved.relTab) !== -1) relTab = saved.relTab;
      if (saved && ['attn', 'seq'].indexOf(saved.relArcMode) !== -1) relArcMode = saved.relArcMode;
      if (saved && ['balanced', 'local', 'struct'].indexOf(saved.relHead) !== -1) relHead = saved.relHead;
      applyLang(lang);

      render();
      setEncoding(sel.value);

      window.addEventListener('zcode:set_globals', function (e) {
        var mc = e && e.detail && e.detail.globals && e.detail.globals.widgetState && e.detail.globals.widgetState.modelContent;
        if (!mc || typeof mc.text !== 'string') return;
        if (document.activeElement === input) return;
        input.value = mc.text;
        if (mc.encoding && ALL_ENC.indexOf(mc.encoding) !== -1) sel.value = mc.encoding;
        if (mc.lang && ALL_LANGS.indexOf(mc.lang) !== -1) applyLang(mc.lang);
        if (typeof mc.relOpen === 'boolean') relOpen = mc.relOpen;
        if (['arc', 'attn', 'adj'].indexOf(mc.relTab) !== -1) relTab = mc.relTab;
        if (['attn', 'seq'].indexOf(mc.relArcMode) !== -1) relArcMode = mc.relArcMode;
        if (['balanced', 'local', 'struct'].indexOf(mc.relHead) !== -1) relHead = mc.relHead;
        render();
      });

      if (typeof window.__TOKEN_TEST_HOOK__ === 'function') {
        window.__TOKEN_TEST_HOOK__({
          I18N: I18N, ALL_LANGS: ALL_LANGS, applyLang: applyLang,
          ensureModule: ensureModule, approxTokens: approxTokens,
          classifyReal: classifyReal, localTokens: localTokens,
          tokenize: tokenize, render: render, setEncoding: setEncoding,
          computeTransitions: computeTransitions, computeApproxAttention: computeApproxAttention,
          renderRelations: renderRelations,
          draw: draw, resize: resize, swells: swells,
          getBadgeKey: function () { return badgeKey; },
          getModEnc: function () { return modEnc; },
          getLang: function () { return lang; },
          getRelState: function () { return { relOpen: relOpen, relTab: relTab, relArcMode: relArcMode, relHead: relHead, lockedIdx: lockedIdx }; }
        });
      }
    })();
  </script>
</div>

  /* 全页背景模式：内容去壳居中 */

    margin: auto; width: 100%; max-width: 880px;

    box-shadow: none; padding: 10px 0 24px;
    position: relative; z-index: 1;
  }
  #tokviz h3 { font-size: 24px; letter-spacing: 0.5px; }

  #tokviz .tok-stat b { font-size: 20px; }

  #tokviz .tk-legend { gap: 16px; }
  #tokviz textarea.form-control { min-height: 88px; }
</style>

<script>
/* data-tooltip 兜底（会话内由宿主提供，独立打开时用这个） */
(function () {
  var tip = document.createElement('div');
  tip.setAttribute('role', 'tooltip');
  tip.style.cssText = 'position:fixed;z-index:99;pointer-events:none;background:rgba(26,26,28,0.95);color:#e7ece9;' +
    'border:1px solid #363638;border-radius:8px;padding:5px 10px;font-size:12px;font-family:ui-monospace,Menlo,monospace;' +
    'opacity:0;transition:opacity .12s;white-space:nowrap;';
  document.body.appendChild(tip);
  var cur = null;
  document.addEventListener('mouseover', function (e) {
    var el = e.target && e.target.closest && e.target.closest('[data-tooltip]');
    if (!el || el === cur) return;
    cur = el;
    tip.textContent = el.getAttribute('data-tooltip');
    tip.style.opacity = '1';
    var r = el.getBoundingClientRect();
    var left = Math.max(8, Math.min(window.innerWidth - tip.offsetWidth - 8, r.left + r.width / 2 - tip.offsetWidth / 2));
    var top = r.top - tip.offsetHeight - 8;
    if (top < 8) top = r.bottom + 8;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  });
  document.addEventListener('mouseout', function (e) {
    if (e.target && e.target.closest && e.target.closest('[data-tooltip]')) { cur = null; tip.style.opacity = '0'; }
  });
})();
</script>
